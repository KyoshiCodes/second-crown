<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Second Crown</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        color: #e8dcc8;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(1200px 600px at 50% -10%, rgba(180, 140, 60, 0.18), transparent 55%),
          radial-gradient(800px 500px at 100% 100%, rgba(40, 20, 10, 0.55), transparent 50%),
          linear-gradient(180deg, #1a1410 0%, #0c0a08 55%, #070605 100%);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(0, 0, 0, 0.08) 3px,
          rgba(0, 0, 0, 0.08) 4px
        );
        opacity: 0.35;
      }
      button {
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
